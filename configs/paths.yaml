# Machine-specific paths. Everything is optional: leave a key blank (or delete
# it) to use the repo-relative default in src/config.py. Any key can also be
# overridden by an environment variable, e.g. EGG_EMBEDDING_DIR=/scratch/emb
#
# Resolution order: --flag  >  EGG_<KEY>  >  this file  >  repo-relative default
#
# Do NOT commit personal paths here — copy this to configs/paths.local.yaml
# (gitignored) if you need machine-specific values.

# --- input data (not redistributable; see data/README.md) -------------------
data_root:              # default: <repo>/data
speech_root:            # default: <data_root>/PTDB-TUG
noise_root:             # default: <data_root>/DEMAND
noisy_root:             # default: <data_root>/NOISY_DATA   (generated by noise_sim.py)

# --- third-party weights (not vendored; see README) -------------------------
state_dict_dir:         # default: <data_root>/StateDicts   (ECAPA2 state dict)

# --- generated artifacts (gitignored) ---------------------------------------
embedding_dir:          # default: <repo>/artifacts/embeddings
checkpoint_dir:         # default: <repo>/artifacts/checkpoints

# --- outputs ----------------------------------------------------------------
results_dir:            # default: <repo>/results
figures_dir:            # default: <repo>/figures
